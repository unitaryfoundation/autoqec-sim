[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoqec-sim"
version = "0.2.0"
description = "Evaluation of stabilizer codes under device noise, and search for codes, encoders, and syndrome-extraction schedules."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Vincent Russo"}]
keywords = ["quantum", "error-correction", "stabilizer", "reinforcement-learning", "clifford"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26,<3",
    "stim>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
rl = [
    "torch>=2.14.0",
]

[project.scripts]
autoqec-ppo = "autoqec_sim.agents.ppo_regress:main"
autoqec-regress = "autoqec_sim.regress:main"
autoqec-schedule = "autoqec_sim.schedule_cli:main"

[project.urls]
Repository = "https://github.com/unitaryfoundation/autoqec-sim"
Changelog = "https://github.com/unitaryfoundation/autoqec-sim/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14", "matplotlib>=3.8"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mike>=2.1",
    "mkdocs-bibtex>=4",
]


[tool.hatch.build.targets.wheel]
packages = ["src/autoqec_sim"]
# Work in progress that is not part of 0.2.0.
exclude = ["src/autoqec_sim/experiments"]

[tool.hatch.build.targets.sdist]
include = [
    "src/autoqec_sim",
    "tests",
    "docs",
    "benchmarks",
    "tools",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = ["src/autoqec_sim/experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["tests/noise/reference"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E402",   # imports after the thread-cap and sys.path edits at module top are intentional
    "E501",   # long lines are docstring tables and result literals
    "C408",   # dict(...) calls are used deliberately for keyword-style budgets and configs
]

[tool.ruff.lint.isort]
known-first-party = ["autoqec_sim"]

# CPU-only torch on Linux for the `rl` extra (the agent is CPU-only; the
# default PyPI wheel on Linux bundles CUDA). macOS wheels on PyPI are CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources.torch]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"
