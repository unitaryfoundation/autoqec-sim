site_name: autoqec-sim
site_url: https://unitaryfoundation.github.io/autoqec-sim/
site_description: >-
  Batched stabilizer-code simulator and reinforcement-learning environment
  for discovering small quantum error-correcting codes.
repo_url: https://github.com/unitaryfoundation/autoqec-sim
repo_name: unitaryfoundation/autoqec-sim
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vincent Russo. Apache-2.0.
strict: true

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: stable

plugins:
  - search
  - bibtex:
      bib_file: docs/refs.bib
      enable_inline_citations: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            members_order: source
            separate_signature: true
            extensions:
              - docs/griffe_extensions.py:SphinxRolesToCode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Choose a Workflow: getting-started/choosing-a-workflow.md
  - User Guide:
      - Overview: guide.md
      - Evaluate:
          - Evaluate a code: evaluate.md
          - Memory objective: memory_objective.md
          - Noise interface: noise.md
          - Device presets: noise_presets.md
      - Propose:
          - Rediscovery regression: regression.md
          - LDPC constraint: ldpc.md
          - Experiments:
              - Overview: experiments/index.md
              - Noise-aware discovery: experiments/noise_aware.md
              - Memory objective runs: experiments/memory_objective.md
              - RL scaling probe: experiments/scaling.md
              - Three-topology matrix: experiments/topologies.md
              - Evolutionary search against PPO: experiments/topologies_ea.md
              - QDX's targets: experiments/qdx_targets.md
              - SAT-designed codes: experiments/sat_codes.md
              - SAT population: experiments/sat_population.md
      - Execution:
          - GPU backend: gpu.md
          - CPU profile: profile.md
      - Reproduce: reproduce.md
  - Reference:
      - Modules: modules.md
      - Commands: reference/commands.md
      - Related work: related-work.md
      - Python API:
          - autoqec_sim: api/autoqec_sim.md
          - Environment and rewards: api/env.md
          - Codes and tableaux: api/code.md
          - Noise module: api/noise.md
          - Schedule synthesis: api/schedule.md
          - Backends, agents, search: api/backends.md
  - Development:
      - Contributing: development/contributing.md
      - Releasing: development/releasing.md
      - Changelog: development/changelog.md
