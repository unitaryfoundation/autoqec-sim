name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }} (no rl)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run pytest -rs

  test-rl:
    # CPU torch from the pytorch-cpu index ([[tool.uv.index]] in pyproject).
    name: py3.12 / ubuntu (rl extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev --extra rl
      - run: uv run pytest

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import autoqec_sim; print(autoqec_sim.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
